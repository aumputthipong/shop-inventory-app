version: "2"
sql:
  - engine: postgresql
    # sqlc understands golang-migrate file naming and ignores *.down.sql.
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: db/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
