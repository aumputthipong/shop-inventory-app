name: shop-inventory-app

services:
  postgres:
    image: postgres:17-alpine
    container_name: shop-inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopinv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopinv}
      POSTGRES_DB: ${POSTGRES_DB:-shopinv}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-shopinv} -d ${POSTGRES_DB:-shopinv}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
