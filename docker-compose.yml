name: shop-inventory-app

services:
  postgres:
    image: postgres:17-alpine
    container_name: shop-inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopinv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopinv}
      POSTGRES_DB: ${POSTGRES_DB:-shopinv}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-shopinv} -d ${POSTGRES_DB:-shopinv}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The services below run with `docker compose --profile app up --build`.
  migrate:
    profiles: [app]
    image: migrate/migrate:v4.19.1
    volumes:
      - ./backend/db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-shopinv}:${POSTGRES_PASSWORD:-shopinv}@postgres:5432/${POSTGRES_DB:-shopinv}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: [app]
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-shopinv}:${POSTGRES_PASSWORD:-shopinv}@postgres:5432/${POSTGRES_DB:-shopinv}?sslmode=disable
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      SEED_STAFF_EMAIL: ${SEED_STAFF_EMAIL:-}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
      LINE_MODE: ${LINE_MODE:-off}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LIFF_ID: ${LINE_LIFF_ID:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
