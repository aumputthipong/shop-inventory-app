name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Keep in step with backend/Makefile, see "Version pins" in CLAUDE.md.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: backend

      - name: go test
        run: go test ./...

  backend-integration:
    name: backend integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GOTOOLCHAIN: local
      TEST_DATABASE_URL: postgres://shopinv:shopinv@localhost:5432/shopinv_test?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shopinv
          POSTGRES_PASSWORD: shopinv
          POSTGRES_DB: shopinv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopinv -d shopinv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache-dependency-path: backend/go.sum

      - name: migrate
        run: go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1 -path db/migrations -database "$TEST_DATABASE_URL" up

      - name: go test (integration)
        run: go test -tags integration -count=1 ./...

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

  image:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: build
        run: docker build -t shop-inventory-app:ci .
