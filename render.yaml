services:
  - type: web
    name: turtle-shop
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_ENV
        value: production
      - key: GIN_MODE
        value: release
      - key: COOKIE_SECURE
        value: "true"
      - key: LINE_MODE
        value: live
      - key: DEMO_ACCOUNTS
        value: owner:owner@demo.shop:demo-owner-2026;staff:staff@demo.shop:demo-staff-2026
      - key: DATABASE_URL
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID
        sync: false
      - key: LINE_LIFF_ID
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
